name: awsum
version: 0.0.4
license: MIT

language: GHC2024

default-extensions:
  #
  # Note on Monomorphism Restriction:
  # - Essence: restricts polymorphism for ALL definitions,
  #   for which no type signatures are specified and which do not "look like functions" (have no binding to the left of = )
  # - Inconvenience: Leads to non-intuitive type inference results - less polymorphic than expected
  # - Convenience: increases performance and reduces memory usage
  #   More details: https://www.youtube.com/watch?v=zpBua3Mql18
  # - Present in the Haskell specification, not just GHC
  # - Disabled by default in GHC 9.4 (via NoMonomorphismRestriction)
  # - But enabled by default in the GHC2021 extension set (via MonomorphismRestriction)
  # - Instead of disabling monomorphism restriction with `NoMonomorphismRestriction`,
  #   we use the enabled `Wmonomorphism-restriction` warning (enabled in `Weverything`),
  #   and warning forces us to place type signatures where monomorphism restriction applies.
  #   And in the process of specifying types, we decide whether to leave polymorphism or a specific type there,
  #   and the behavior will always be as expected.
  #
  - NoImplicitPrelude # Note: For Relude
  - DeriveAnyClass
  - DerivingVia
  - DuplicateRecordFields
  - OverloadedRecordDot
  - OverloadedStrings

extra-source-files:
  - README.md
  - CHANGELOG.md
  - stdlib/Prelude.aww

description: Please see the README on GitHub at <https://github.com/awsum-lang/awsum#readme>

dependencies:
  - base >= 4.7 && < 5
  - relude # an alternative to Prelude

ghc-options:
  # Use up to 16 cores for compilation https://ghc.gitlab.haskell.org/ghc/doc/users_guide/using.html?highlight=j#ghc-flag--j[%E2%9F%A8n%E2%9F%A9]
  - -j16
    # Set up rts options for GHC itself https://ghc.gitlab.haskell.org/ghc/doc/users_guide/runtime_control.html#setting-rts-options
  - +RTS -A32m -RTS
    # Optimization level:
    # -O0 produces a non-optimized binary (significantly reduces Seq performance), but builds fast.
    # -O2 produces a heavily optimized binary, but builds ~ 2 times slower.
    # Note: Stack reuses existing binaries instead of rebuilding if the source code hasn't changed.
    # We build optimized binaries by default and turn optimizations off by `--fast` flag (avoid!).
  - -O2
    # Enables local documentation
  - -haddock
    # Enable all possible warnings as errors (Werror is provided manually in dockerfile for production builds and CI)
  - -Weverything
    # Complains about imported functions
  - -Wno-all-missed-specialisations
    # Complains about imported functions
  - -Wno-missed-specialisations
    # Requires signatures for all local definitions
  - -Wno-missing-local-signatures
    # Requires to mark unsafe modules as unsafe
  - -Wno-unsafe
    # Requires kind signature for every newtype.
  - -Wno-missing-kind-signatures
    # A lot of modules modules are still not "safe haskell".
  - -Wno-missing-safe-haskell-mode
    # Requires import lists for all record fields and all value constructors
  - -Wno-missing-import-lists

library:
  source-dirs: src
  dependencies:
    - aeson # for parsing initializationOptions JSON in Awsum.Lsp
    - bytestring # for JVM bytecode assembler
    - containers # for Data.Graph SCC analysis (unused-top-level warning)
    - directory # for workspace symbol scan in Awsum.Lsp
    - file-embed # for bundling stdlib/Prelude.aww into the compiler binary
    - filepath # for workspace symbol scan in Awsum.Lsp
    - lens # for Language.LSP.Protocol.Lens accessors used by Awsum.Lsp
    - lsp # for `awsum lsp` subcommand
    - lsp-types # transitive of lsp, used for protocol records / SMethod singletons
    - megaparsec # for parser
    - text # for Data.Text.Encoding (JVM assembler)

executables:
  awsum:
    main: Main.hs
    source-dirs: awsum
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - awsum
      - filepath # for CLI
      - optparse-applicative # for working with command line arguments
      - pretty-simple # for pretty-printing any Show instances
      - process # for CLI
      - temporary # for temporary files

  awsum-bench:
    main: Bench.hs
    source-dirs: bench
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - awsum
      - filepath # for FilePath ops
      - optparse-applicative # for CLI args
      - process # for /usr/bin/time + clang
      - temporary # for per-run scratch directory
      - text # for stderr parsing
      - time # for wall-clock measurement

  awsum-stats:
    main: Stats.hs
    source-dirs: stats
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - awsum
      - directory # for scanning test/sources/successful/
      - filepath
      - text
flags:
  tree-sitter-tests:
    description: |
      Build the `tree-sitter-tests` test-suite, which exercises the
      external `tree-sitter-awsum` grammar by parsing every `.aww`
      under `test/sources/successful/` and `test/sources/property/`,
      plus an arbitrary-program property test. Disabled by default so
      CI doesn't build a suite that depends on the `tree-sitter` CLI
      and a sibling `../tree-sitter-awsum` checkout. Enable with
      `stack test --flag awsum:tree-sitter-tests` (or via the
      `just test-tree-sitter[-property]` recipes).
    default: false
    manual: true
  textmate-tests:
    description: |
      Build the `textmate-tests` test-suite, which exercises the
      `awsum.tmLanguage.json` TextMate grammar shipped in
      `awsum-vscode/`. Shells out to a small Node script that
      tokenizes every `.aww` in the corpus and every arbitrary-
      generated `Program` through `vscode-textmate` — the same
      engine VSCode runs in production — and asserts invariants on
      the resulting scope stacks. Disabled by default so CI's main
      suite doesn't depend on Node or a sibling `../awsum-vscode/`
      checkout with `npm install` already run inside it. Enable
      with `stack test --flag awsum:textmate-tests` (or via the
      `just test-textmate[-property]` recipes).
    default: false
    manual: true

tests:
  awsum-test:
    main: Main.hs
    source-dirs: test
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - awsum
      - aeson # transitively required by the auto-discovered Awsum.TextMateSpec module; the spec itself only runs in the `textmate-tests` test-suite
      - async # for concurrent backend execution
      - directory # for test discovery
      - filepath # for codegen tests
      - hspec # for unit tests
      - hspec-golden # for snapshot tests
      - pretty-simple # for pretty-printing snapshots
      - process # for codegen tests
      - QuickCheck # for property-based tests
      - temporary # for temporary files
      - text # transitively required by the auto-discovered Awsum.TextMateSpec module

  tree-sitter-tests:
    main: TreeSitterMain.hs
    source-dirs: test
    # Only buildable when the `tree-sitter-tests` flag is on. CI's
    # `just test` / `just test-property` invocations don't pass it,
    # so the suite (and its dependency on the `tree-sitter` CLI plus
    # a sibling `../tree-sitter-awsum`) is invisible there.
    when:
      - condition: "!flag(tree-sitter-tests)"
        buildable: false
    # Only compile the modules this suite actually uses; avoids
    # pulling in the snapshot / property / etc. modules from the
    # shared `test/` directory.
    other-modules:
      - Awsum.ArbitraryInstances
      - Awsum.TreeSitterSpec
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
      # Two test-suites share `test/` as source-dir, so they need
      # different main-file names; the tree-sitter suite's main file
      # is `TreeSitterMain.hs` with `module TreeSitterMain`, and
      # `-main-is` tells GHC where to find `main`.
      - -main-is TreeSitterMain
    dependencies:
      - awsum
      - directory
      - filepath
      - hspec
      - QuickCheck
      - process
      - temporary

  textmate-tests:
    main: TextMateMain.hs
    source-dirs: test
    # Only buildable when the `textmate-tests` flag is on. CI's
    # `just test` / `just test-property` invocations don't pass it,
    # so the suite (and its dependency on `node` plus a sibling
    # `../awsum-vscode/` checkout with `npm install` already run) is
    # invisible there.
    when:
      - condition: "!flag(textmate-tests)"
        buildable: false
    # Only compile the modules this suite actually uses; avoids
    # pulling in the snapshot / property / etc. modules from the
    # shared `test/` directory.
    other-modules:
      - Awsum.ArbitraryInstances
      - Awsum.TextMateSpec
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
      # Three test-suites share `test/` as source-dir, so they need
      # different main-file names; the textmate suite's main file is
      # `TextMateMain.hs` with `module TextMateMain`, and `-main-is`
      # tells GHC where to find `main`.
      - -main-is TextMateMain
    dependencies:
      - awsum
      - aeson
      - directory
      - filepath
      - hspec
      - QuickCheck
      - process
      - temporary
      - text
