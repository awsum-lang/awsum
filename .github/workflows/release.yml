name: Release

# Tag is the source of truth: pushing `v*` is what creates an immutable release
# tied to a specific commit. There is intentionally no `workflow_dispatch` here —
# if a release run fails, delete the tag, fix, retag.
on:
  push:
    tags:
      - "v*"

# Don't cancel a release mid-flight if a second tag arrives somehow.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/check-and-build.yml
    with:
      upload-artifacts: true

  release:
    name: Publish GitHub Release
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      # Required for `gh release create` to upload assets.
      contents: write
      # Required for `actions/attest-build-provenance` — it mints an OIDC token
      # to identify the workflow to Sigstore, and writes the attestation entry.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: awsum-*

      # Asset names embed the version (`awsum-<version>-<target>.{tar.gz,zip}`)
      # — the website always links to a specific version, so the GitHub
      # `releases/latest/download/` redirect is intentionally not used. Once a
      # user has downloaded the file, the filename itself records what they got.
      #
      # `actions/upload-artifact@v4` does not preserve the executable bit on
      # POSIX targets, so we re-`chmod +x` before packaging. Tar/zip then
      # preserve it on extract.
      - name: Package binaries
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for dir in artifacts/awsum-*; do
            target="${dir#artifacts/awsum-}"
            stage="$(mktemp -d)"
            cp "$dir"/awsum* "$stage"/
            chmod +x "$stage"/awsum*
            if [[ "$target" == windows-* ]]; then
              ( cd "$stage" && zip -j -q "$GITHUB_WORKSPACE/dist/awsum-${version}-${target}.zip" awsum.exe )
            else
              tar -C "$stage" -czf "dist/awsum-${version}-${target}.tar.gz" awsum
            fi
          done
          ( cd dist && sha256sum awsum-* > SHA256SUMS )
          ls -la dist

      # Attest each binary archive (not SHA256SUMS — its provenance is "I summed
      # these files", redundant given the per-archive attestations record the
      # same hashes). Users verify with:
      #   gh attestation verify awsum-X.Y.Z-<target>.tar.gz --repo awsum-lang/awsum
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/awsum-*.tar.gz
            dist/awsum-*.zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "See [CHANGELOG.md](./CHANGELOG.md)" \
            dist/*
