name: CI

on:
  workflow_call:
    inputs:
      upload-artifacts:
        description: "Upload the built awsum binary as a workflow artifact (consumed by the release workflow)."
        type: boolean
        default: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Detect Cyrillic
        run: bash scripts/detect-cyrillic.sh

      - name: Set up HLint
        uses: haskell-actions/hlint-setup@v2
        with:
          # Note: The quotes are important:
          # "3.10" -> 3.10 will be installed
          # 3.10 -> 3.1 will be installed
          version: "3.10"

      - name: Run HLint
        uses: haskell-actions/hlint-run@v2
        with:
          path: .
          hlint-bin: hlint --hint=.hlint.yaml
          fail-on: warning

  build-and-test:
    name: Build and Test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     target: linux-x86_64-gnu,     llvm-flavor: apt   }
          - { os: ubuntu-24.04-arm, target: linux-aarch64-gnu,    llvm-flavor: apt   }
          - { os: macos-15,         target: macos-aarch64,        llvm-flavor: brew  }
          - { os: windows-2025,     target: windows-x86_64,       llvm-flavor: msvc  }
          - { os: windows-2025,     target: windows-x86_64-mingw, llvm-flavor: mingw }

    env:
      # Pin STACK_ROOT to a workspace-relative path so cache keys and paths are
      # identical across Linux / macOS / Windows (stack's default root differs
      # per OS, which would break the cache action's ~ expansion on Windows).
      STACK_ROOT: ${{ github.workspace }}/.stack-root

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6

      # LLVM 15+ is required for opaque pointers (see README — Installation ▸ Target runtimes).
      # Per-OS setup because no single mechanism covers all four runners cleanly:
      # - apt has clang-15 prebuilt for both Linux x64 and Linux arm64 (upstream LLVM
      #   doesn't publish prebuilt linux-arm64 archives for 15.0.7, ruling out the
      #   otherwise-nice KyleMayes action here).
      # - brew has llvm@15 for macOS arm64.
      # - Windows runners preinstall a newer clang and put it earlier on PATH than
      #   anything choco installs; KyleMayes's action is the only Windows setup
      #   that prepends (not appends) its install to PATH, so it actually wins over
      #   the preinstalled version.

      - name: Set up LLVM 15 (Linux)
        if: runner.os == 'Linux'
        # Ubuntu 24.04 runners preinstall clang-18 with a high-priority
        # update-alternatives entry, so `--install … 100` for clang-15 creates
        # the alternative but doesn't win. A symlink in /usr/local/bin
        # sidesteps alternatives entirely — it's ahead of /usr/bin in the
        # runner's default PATH.
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-15
          sudo ln -sf /usr/bin/clang-15 /usr/local/bin/clang

      - name: Set up LLVM 15 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@15
          echo "$(brew --prefix llvm@15)/bin" >> "$GITHUB_PATH"

      - name: Set up LLVM 15 (Windows MSVC)
        if: matrix.llvm-flavor == 'msvc'
        shell: pwsh
        # Download the official LLVM 15.0.7 Windows installer and silent-install
        # into a pristine per-runner directory. Avoids two traps we hit with
        # choco / KyleMayes action:
        #   1. Preinstalled LLVM 20 lives at `C:\Program Files\LLVM` — installing
        #      over it left behind a mixed 15/20 tree, or the preinstall was still
        #      first on PATH.
        #   2. Visual Studio 2022's bundled clang (`VC\Tools\Llvm\bin\clang.exe`)
        #      has been shadowing everything on some runner images, giving
        #      LLVM-14-era `ptr type is only supported in -opaque-pointers mode`
        #      errors even after 15.0.7 install succeeded.
        # Prepending our pristine bin to $GITHUB_PATH puts it ahead of both.
        run: |
          $ErrorActionPreference = 'Stop'
          $url  = "https://github.com/llvm/llvm-project/releases/download/llvmorg-15.0.7/LLVM-15.0.7-win64.exe"
          $exe  = "$env:RUNNER_TEMP\llvm-installer.exe"
          $dest = "$env:RUNNER_TEMP\llvm"
          curl.exe -fsSL --retry 3 --retry-delay 2 -o $exe $url
          $size = (Get-Item $exe).Length
          if ($size -lt 1000000) {
            throw "LLVM installer is only $size bytes — download likely failed"
          }
          # NSIS silent install with custom destination (/D must be last, unquoted).
          Start-Process -FilePath $exe -ArgumentList "/S","/D=$dest" -Wait -NoNewWindow
          if (-not (Test-Path "$dest\bin\clang.exe")) {
            throw "clang.exe not found at $dest\bin after install"
          }
          Add-Content -Path $env:GITHUB_PATH -Value "$dest\bin"

      # Second Windows axis — WinLibs's mingw-w64-flavored LLVM, contrasted
      # with the MSVC-flavored llvm-project build on the canonical job.
      # Default-triple is x86_64-w64-mingw32 and the link line auto-pulls
      # the mingw-w64 system-lib set. Pinning the latest UCRT bundle WinLibs
      # publishes — the version skew vs MSVC's 15.0.7 is the point. Lands at
      # the same $env:RUNNER_TEMP\llvm\bin path as the MSVC step. Uses .7z
      # (~150 MB vs ~800 MB .zip) via the runner-preinstalled 7z.exe; archive
      # extracts to mingw64/ which we Move-Item to $dest.
      - name: Set up LLVM 19 (Windows MinGW)
        if: matrix.llvm-flavor == 'mingw'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag     = "14.2.0posix-12.0.0-ucrt-r3"  # GCC 14.2.0 + LLVM 19.1.7 + mingw-w64 12.0.0 + UCRT
          $file    = "winlibs-x86_64-posix-seh-gcc-14.2.0-llvm-19.1.7-mingw-w64ucrt-12.0.0-r3.7z"
          $url     = "https://github.com/brechtsanders/winlibs_mingw/releases/download/$tag/$file"
          $archive = "$env:RUNNER_TEMP\winlibs.7z"
          $extract = "$env:RUNNER_TEMP\winlibs-extract"
          $dest    = "$env:RUNNER_TEMP\llvm"
          curl.exe -fsSL --retry 3 --retry-delay 2 -o $archive $url
          $size = (Get-Item $archive).Length
          if ($size -lt 50000000) {
            throw "WinLibs archive is only $size bytes — download likely failed"
          }
          New-Item -ItemType Directory -Path $extract -Force | Out-Null
          & 7z x $archive "-o$extract" -y -bd | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "7z extraction failed with exit $LASTEXITCODE"
          }
          Move-Item "$extract\mingw64" $dest
          if (-not (Test-Path "$dest\bin\clang.exe")) {
            throw "clang.exe not found at $dest\bin after extract"
          }
          Add-Content -Path $env:GITHUB_PATH -Value "$dest\bin"

      - name: Verify clang resolves to LLVM 15+
        shell: bash
        run: |
          set -eu
          echo "=== clang --version ==="
          clang --version
          echo "=== which clang ==="
          command -v clang
          # Hard fail if major < 15 — catches the Windows PATH-shadowing case
          # (GHC's bundled mingw clang is LLVM 14, missing opaque pointers)
          # before the actual tests run, and without dumping a 50k-line AST
          # on mismatch. The two Windows jobs run different LLVM majors on
          # purpose (MSVC=15.0.7, WinLibs=19.1.7) — both are >= our floor.
          if clang --version | head -n1 | grep -qE 'version (1[5-9]|[2-9][0-9])\.'; then
            echo "OK: clang is LLVM 15+"
          else
            echo "ERROR: clang is older than LLVM 15"
            exit 1
          fi

      # Pin Java to 11 — the documented JVM target floor (see
      # docs/platform-version-policy.md). The assembler emits class
      # version 55.0 (Java 11); JDK 11 understands it natively, and on
      # any JDK ≥ 11 the same .class loads. Temurin (Eclipse Adoptium)
      # distribution kept for consistency across the four runners.
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "11"

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9"

      - name: Set up Wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: "latest"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: "3.9.1"
          stack-no-global: true

      # Cache key includes 'matrix.target' (not just runner.os/arch) so the two
      # Windows jobs (MSVC and MinGW flavors of LLVM, same runner image) don't
      # clobber each other's cache — without it, every other run would be cold
      # for whichever flavor lost the race to write last.
      - name: Restore STACK_ROOT cache
        id: cache-stack-global
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.STACK_ROOT }}
          key: ${{ matrix.target }}-stack-global-${{ hashFiles('stack.yaml', 'stack.yaml.lock', 'package.yaml', 'awsum.cabal') }}
          restore-keys: |
            ${{ matrix.target }}-stack-global-

      - name: Restore .stack-work cache
        id: cache-stack-work
        uses: actions/cache/restore@v5
        with:
          path: .stack-work
          key: ${{ matrix.target }}-stack-work-${{ hashFiles('stack.yaml', 'stack.yaml.lock', 'package.yaml', 'awsum.cabal', 'src/**/*.hs', 'test/**/*.hs', 'awsum/**/*.hs') }}
          restore-keys: |
            ${{ matrix.target }}-stack-work-

      - name: Build dependencies
        run: stack build --only-dependencies --test --no-run-tests

      - name: Build
        run: stack build --pedantic --copy-bins --local-bin-path target --test --no-run-tests

      # On Windows, the test harness pins clang via AWSUM_CLANG (absolute
      # path) instead of relying on PATH. Stack on Windows prepends GHC's
      # bundled mingw bin to its child processes' PATH, and the clang.exe
      # in that mingw is an older LLVM 14 build that doesn't speak our IR
      # (no opaque-pointers default). We can't replace GHC's mingw clang
      # — GHC itself uses it for FFI compilation. AWSUM_CLANG bypasses
      # PATH lookup entirely from inside the test harness.
      - name: Test (Linux / macOS)
        if: runner.os != 'Windows'
        run: stack test --pedantic

      - name: Test (Windows)
        if: runner.os == 'Windows'
        env:
          AWSUM_CLANG: ${{ runner.temp }}\llvm\bin\clang.exe
        run: stack test --pedantic

      # Only runs when called from the release workflow. The path glob picks up
      # `awsum` on Unix and `awsum.exe` on Windows; upload-artifact strips the
      # `target/` prefix because the wildcard sits at the leaf, so consumers
      # download a flat archive containing just the binary.
      #
      # The mingw Windows job is excluded here on purpose: awsum.exe itself is
      # GHC output (linked against GHC's bundled mingw runtime), so the binary
      # is identical regardless of which external clang the runner has — the
      # mingw job is a CI-only smoke test that proves the released awsum.exe
      # still drives the *user's* clang correctly when that clang is mingw.
      - name: Upload binary artifact
        if: inputs.upload-artifacts && matrix.llvm-flavor != 'mingw'
        uses: actions/upload-artifact@v7
        with:
          name: awsum-${{ matrix.target }}
          path: target/awsum*
          if-no-files-found: error
          retention-days: 7

      - name: Save STACK_ROOT cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ${{ env.STACK_ROOT }}
          key: ${{ steps.cache-stack-global.outputs.cache-primary-key }}

      - name: Save .stack-work cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .stack-work
          key: ${{ steps.cache-stack-work.outputs.cache-primary-key }}
