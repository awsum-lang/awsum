name: CI

on:
  workflow_call:

jobs:
  hlint:
    name: HLint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up HLint
        uses: haskell-actions/hlint-setup@v2
        with:
          # Note: The quotes are important:
          # "3.10" -> 3.10 will be installed
          # 3.10 -> 3.1 will be installed
          version: "3.10"

      - name: Run HLint
        uses: haskell-actions/hlint-run@v2
        with:
          path: .
          hlint-bin: hlint --hint=.hlint.yaml
          fail-on: warning

  build-and-test:
    name: Build and Test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,  ext: "" }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, ext: "" }
          - { os: macos-latest,     target: aarch64-apple-darwin,      ext: "" }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,    ext: ".exe" }

    env:
      # Pin STACK_ROOT to a workspace-relative path so cache keys and paths are
      # identical across Linux / macOS / Windows (stack's default root differs
      # per OS, which would break the cache action's ~ expansion on Windows).
      STACK_ROOT: ${{ github.workspace }}/.stack-root

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6

      # LLVM 15+ is required for opaque pointers (see README — Installation ▸ Target runtimes).
      # Per-OS setup because no single mechanism covers all four runners cleanly:
      # - apt has clang-15 prebuilt for both Linux x64 and Linux arm64 (upstream LLVM
      #   doesn't publish prebuilt linux-arm64 archives for 15.0.7, ruling out the
      #   otherwise-nice KyleMayes action here).
      # - brew has llvm@15 for macOS arm64.
      # - Windows runners preinstall a newer clang and put it earlier on PATH than
      #   anything choco installs; KyleMayes's action is the only Windows setup
      #   that prepends (not appends) its install to PATH, so it actually wins over
      #   the preinstalled version.

      - name: Set up LLVM 15 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-15
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-15 100

      - name: Set up LLVM 15 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@15
          echo "$(brew --prefix llvm@15)/bin" >> "$GITHUB_PATH"

      - name: Set up LLVM 15 (Windows)
        if: runner.os == 'Windows'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "15.0.7"

      # Pin Java to 8 — lowest JVM still installable across our four runners.
      # README ▸ Targets documents "Java 7+" as the minimum; the assembler
      # (awsum/CLAUDE.md ▸ "Class file version") emits 51.0 to stay compatible
      # with Android's dex input requirement. Java 7 itself is no longer
      # available via actions/setup-java on macOS ARM64, so 8 is the realistic
      # floor — still an old-enough JVM to catch anything that would break on
      # pre-9 runtimes, without going through Rosetta hacks. Zulu because
      # Temurin has no native macOS-ARM64 build of 8.
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "8"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9"

      - name: Set up Wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: "latest"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # Pin Lua to 5.1 — the minimum version documented in README ▸ Targets
      # ("Lua 5.1+"). Testing against the floor of the supported range proves the
      # compatibility contract; anything newer is implicitly covered via Lua's
      # own backward-compat guarantees. leafo/gh-actions-lua handles this
      # uniformly on Linux/macOS; Windows has no maintained action that supports
      # Lua 5.1, so we fetch the official LuaBinaries build directly.

      - name: Set up Lua 5.1 (Linux/macOS)
        if: runner.os != 'Windows'
        uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "5.1.5"

      - name: Set up Lua 5.1 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # SourceForge serves the real archive only after following a chain of
          # redirects and picking a mirror; Invoke-WebRequest has historically
          # landed on the HTML "download page" instead of the zip (observable
          # as Expand-Archive throwing `OperationStopped` on a tiny HTML file).
          # curl.exe with -L + retries follows SF's redirects reliably.
          $url  = "https://sourceforge.net/projects/luabinaries/files/5.1.5/Tools%20Executables/lua-5.1.5_Win64_bin.zip/download"
          $zip  = "$env:RUNNER_TEMP\lua.zip"
          $dest = "$env:RUNNER_TEMP\lua"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          curl.exe -fsSL --retry 3 --retry-delay 2 -o $zip $url
          # Real zip is ~700KB; HTML interstitial is ~10KB. Fail loud if SF
          # regresses to serving the interstitial again.
          $size = (Get-Item $zip).Length
          if ($size -lt 100000) {
            throw "Downloaded file is only $size bytes — SourceForge likely served an HTML interstitial instead of the zip."
          }
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          # LuaBinaries ships the interpreter as `lua5.1.exe`; alias it to
          # `lua.exe` so the test harness can call `lua` without a version suffix.
          Copy-Item "$dest\lua5.1.exe" "$dest\lua.exe" -Force
          Add-Content -Path $env:GITHUB_PATH -Value $dest
          & "$dest\lua.exe" -v

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: latest
          stack-no-global: true

      - name: Restore STACK_ROOT cache
        id: cache-stack-global
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.STACK_ROOT }}
          key: ${{ runner.os }}-${{ runner.arch }}-stack-global-${{ hashFiles('stack.yaml', 'stack.yaml.lock', 'package.yaml', 'awsum.cabal') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-stack-global-

      - name: Restore .stack-work cache
        id: cache-stack-work
        uses: actions/cache/restore@v5
        with:
          path: .stack-work
          key: ${{ runner.os }}-${{ runner.arch }}-stack-work-${{ hashFiles('stack.yaml', 'stack.yaml.lock', 'package.yaml', 'awsum.cabal', 'src/**/*.hs', 'test/**/*.hs', 'awsum/**/*.hs') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-stack-work-

      - name: Build dependencies
        run: stack build --only-dependencies --test --no-run-tests

      - name: Build
        run: stack build --pedantic --copy-bins --local-bin-path target --test --no-run-tests

      - name: Test
        run: stack test --pedantic

      - name: Save STACK_ROOT cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ${{ env.STACK_ROOT }}
          key: ${{ steps.cache-stack-global.outputs.cache-primary-key }}

      - name: Save .stack-work cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .stack-work
          key: ${{ steps.cache-stack-work.outputs.cache-primary-key }}
