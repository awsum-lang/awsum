name: CI

on:
  workflow_call:

jobs:
  hlint:
    name: HLint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up HLint
        uses: haskell-actions/hlint-setup@v2
        with:
          # Note: The quotes are important:
          # "3.10" -> 3.10 will be installed
          # 3.10 -> 3.1 will be installed
          version: "3.10"

      - name: Run HLint
        uses: haskell-actions/hlint-run@v2
        with:
          path: .
          hlint-bin: hlint --hint=.hlint.yaml
          fail-on: warning

  build-and-test:
    name: Build and Test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,  ext: "" }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, ext: "" }
          - { os: macos-latest,     target: aarch64-apple-darwin,      ext: "" }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,    ext: ".exe" }

    env:
      # Pin STACK_ROOT to a workspace-relative path so cache keys and paths are
      # identical across Linux / macOS / Windows (stack's default root differs
      # per OS, which would break the cache action's ~ expansion on Windows).
      STACK_ROOT: ${{ github.workspace }}/.stack-root

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6

      # LLVM 15+ is required for opaque pointers (see README — Installation ▸ Target runtimes).
      # Pinning to 15 keeps CI aligned with the minimum documented version rather than
      # drifting to whatever each runner happens to ship.

      - name: Set up LLVM 15 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-15
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-15 100

      - name: Set up LLVM 15 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@15
          echo "$(brew --prefix llvm@15)/bin" >> "$GITHUB_PATH"

      - name: Set up LLVM 15 (Windows)
        if: runner.os == 'Windows'
        # windows-latest ships a newer LLVM preinstalled; --allow-downgrade lets
        # choco replace it with the pinned 15.0.7 we actually want.
        run: choco install --no-progress -y --allow-downgrade llvm --version=15.0.7

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9"

      - name: Set up Wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: "latest"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Lua (Linux/macOS)
        if: runner.os != 'Windows'
        uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "5.4.8"

      - name: Set up Lua (Windows)
        if: runner.os == 'Windows'
        run: choco install --no-progress -y lua

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: latest
          stack-no-global: true

      - name: Restore STACK_ROOT cache
        id: cache-stack-global
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.STACK_ROOT }}
          key: ${{ runner.os }}-${{ runner.arch }}-stack-global-${{ hashFiles('stack.yaml', 'stack.yaml.lock', 'package.yaml', 'awsum.cabal') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-stack-global-

      - name: Restore .stack-work cache
        id: cache-stack-work
        uses: actions/cache/restore@v5
        with:
          path: .stack-work
          key: ${{ runner.os }}-${{ runner.arch }}-stack-work-${{ hashFiles('stack.yaml', 'stack.yaml.lock', 'package.yaml', 'awsum.cabal', 'src/**/*.hs', 'test/**/*.hs', 'awsum/**/*.hs') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-stack-work-

      - name: Build dependencies
        run: stack build --only-dependencies --test --no-run-tests

      - name: Build
        run: stack build --pedantic --copy-bins --local-bin-path target --test --no-run-tests

      - name: Test
        run: stack test --pedantic

      - name: Save STACK_ROOT cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ${{ env.STACK_ROOT }}
          key: ${{ steps.cache-stack-global.outputs.cache-primary-key }}

      - name: Save .stack-work cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .stack-work
          key: ${{ steps.cache-stack-work.outputs.cache-primary-key }}
